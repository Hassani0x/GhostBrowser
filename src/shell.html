<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'none'">
<title>Ghost Browser</title><link rel="stylesheet" href="shell.css"></head>
<body>
<header>
  <div class="tab-row"><div class="brand"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 21V10a7 7 0 0 1 14 0v11l-3-2-4 2-4-2z"/><path d="M9 10v3m6-3v3"/></svg>ghost<span>BROWSER</span></div><div id="tabs" role="tablist" aria-label="Browser tabs"></div><button id="new" class="icon" aria-label="New tab (Ctrl+T)" title="New tab (Ctrl+T)">+</button></div>
  <div class="navigation"><button id="back" class="icon" aria-label="Back" title="Back">←</button><button id="forward" class="icon" aria-label="Forward" title="Forward">→</button><button id="reload" class="icon" aria-label="Reload (Ctrl+R)" title="Reload">↻</button><button id="home" class="icon" aria-label="Home" title="Home">⌂</button><form id="address-form"><label class="sr-only" for="address">Website address or search</label><input id="address" spellcheck="false" autocomplete="off" placeholder="Search or enter a website address"><button type="submit" aria-label="Go to address">Go</button></form><button id="screenshot" class="icon" aria-label="Capture screenshot area" title="Capture an area outside Ghost (Ctrl+Shift+S)"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h4l2-3h4l2 3h4v13H4z"/><circle cx="12" cy="13" r="3.5"/></svg></button><button id="pin" aria-pressed="false" title="Keep Ghost above other windows">Pin on top</button><button id="hide" title="Hide browser (Ctrl+Shift+Space)">Hide</button></div>
  <div class="status"><span id="protection">Checking capture exclusion…</span><span id="notice" role="status">Verify with a second participant before sharing.</span><span id="shortcut">Ctrl + Shift + Space to hide / show</span></div>
</header>
<section id="microphone-prompt" hidden aria-label="Microphone permission" role="region">
  <div><strong>Allow microphone access?</strong><span id="microphone-origin"></span></div>
  <button id="microphone-block">Block</button><button id="microphone-allow">Allow for this session</button>
</section>
<script src="shell.js"></script>
</body></html>
