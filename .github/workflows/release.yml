name: Release Windows preview

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to release
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build and publish Windows portable app
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Build portable executable
        run: npm run dist

      - name: Create checksums
        shell: pwsh
        run: |
          $artifact = Get-ChildItem release -Filter 'Ghost-Browser-*.exe' | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $artifact) { throw 'Portable executable was not produced.' }
          $hash = (Get-FileHash $artifact.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($artifact.Name)" | Set-Content release/SHA256SUMS.txt

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: Ghost Browser ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          prerelease: true
          files: |
            release/Ghost-Browser-*.exe
            release/SHA256SUMS.txt
